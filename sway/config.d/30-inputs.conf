# 1. Keyboard Layout
input type:keyboard {
    xkb_layout us
    xkb_variant intl
}

# 2. TrackPoint
input type:pointer {
    accel_profile flat
    pointer_accel 0
}

# 3. Touchpad
input "10182:480:GXTP5100:00_27C6:01E0_Touchpad" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    accel_profile adaptive
    drag enabled
    drag_lock disabled
}
