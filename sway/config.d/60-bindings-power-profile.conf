# Key binding to toggle power profiles using a custom script
# Triggered via the hardware favorites/special key (XF86Favorites)

bindsym --locked XF86Favorites exec ~/.config/sway/scripts/toggle-power-profile.sh


# Battery Threshold Toggle (Shift + Favorites)
bindsym --locked Shift+XF86Favorites exec ~/.config/sway/scripts/toggle-battery-threshold.sh
