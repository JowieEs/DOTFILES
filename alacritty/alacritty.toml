[env]
TERM = "xterm-256color"

[general]
import = ["~/.config/alacritty/themes/themes/one_dark.toml"]

[window]
opacity = 0.95
dynamic_padding = true

[window.padding]
x = 5
y = 5

[cursor]
style = "Beam"

[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[mouse]
hide_when_typing = true
